name: Feature Request
description: Suggest an idea for this project.
labels: ['enhancement']
assignees: ['AlfishSoftware']
body:
  - type: markdown
    attributes:
      value: |
        ### Before you begin
        1. Confirm that your proposal hasn't already been reported.
        2. Confirm that you upgraded to the latest version of the plugin.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: |
        Is your feature request related to a problem?
        Add a clear and concise description of what the problem is.
      placeholder: |
        I'm always frustrated when ...
  - type: textarea
    id: solution
    validations:
      required: true
    attributes:
      label: Solution
      description: |
        A clear and concise description of what you want to happen.
      placeholder: |
        Describe the solution you'd like.
  - type: textarea
    id: alt
    attributes:
      label: Alternatives
      description: |
        A clear and concise description of any alternative solutions or features you've considered.
      placeholder: |
        Describe alternatives you've considered.
  - type: textarea
    id: misc
    attributes:
      label: Additional info
      description: |
        If applicable.
      placeholder: |
        Add any other context or screenshots about the feature request here.
